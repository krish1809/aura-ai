[project]
name = "aura-ml"
version = "0.1.0"
description = "Aura ML: data pipelines, training and inference for multimodal emotional support"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Everything needed to run the trained models (backend in ML_MODE=local)
inference = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46,<5",
    "accelerate>=1.0",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "spacy>=3.7,<4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# Extra pieces for training the encoders and the LLM
train = [
    "aura-ml[inference]",
    "datasets>=3.0",
    "pillow>=10",
    "unsloth",
    "trl>=0.12",
]

[project.scripts]
aura-ml = "aura_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_ml"]

[tool.hatch.metadata]
allow-direct-references = true  # the pinned spaCy English model wheel
