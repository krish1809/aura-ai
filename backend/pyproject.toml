[project]
name = "aura-api"
version = "0.1.0"
description = "Aura backend: FastAPI + WebSocket service orchestrating the Aura ML models"
requires-python = ">=3.11"
dependencies = [
    "aura-ml",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["aura-ml[inference]"]

[tool.uv.sources]
aura-ml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_api"]
