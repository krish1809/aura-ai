[project]
name = "aura-ai"
version = "0.1.0"
description = "Aura: a multimodal emotional-support companion (workspace root)"
requires-python = ">=3.11"
dependencies = ["aura-ml", "aura-api"]

[tool.uv.workspace]
members = ["ml", "backend"]

[tool.uv.sources]
aura-ml = { workspace = true }
aura-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aura_ml", "aura_api"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
asyncio_mode = "auto"
markers = [
    "torch: needs torch + model weights (skipped when unavailable)",
]
